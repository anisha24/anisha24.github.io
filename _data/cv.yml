      institution: Cisco Systems, Inc
      logo: assets/img/cisco.png
      year: 2020 - Present
      description:
        - At Cisco, I work on building intelligent systems that automate network testing, root cause analysis, and data observability. I’ve fine-tuned open-source LLMs to create ChatGPT-like tools for automating network test generation and execution. My work includes developing NLP-driven RCA systems, designing data pipelines to extract actionable KPIs, and leveraging forecasting models to predict network performance—enabling proactive issue resolution and improving operational visibility through real-time dashboards.
    - title: Software Engineer Intern
      institution: Cisco Systems, Inc
      logo: assets/img/cisco.png
      year: 2020
      description:
        - Worked on network process automation for large-scale enterprise networks, building microservices to streamline device onboarding and configuration, achieving a 95% reduction in setup time. Also developed device health monitoring modules integrated with network controllers for proactive management.
    - title: Software Engineer Intern
      institution: Center for Development of Advanced Computing (C-DAC)
      logo: assets/img/cdac.png
      year: 2019 - 2020
      description:
        - Developed a system to process and store sensor network data on a private cloud as part of an IoT initiative for smart cities. Built custom data pipelines using Kafka, Mosquitto MQTT and Redis for real-time streaming and caching, with MongoDB for storage. Created NodeJS APIs and Angular dashboards to visualize live sensor data. The solution was directly integrated into the organization’s smart city infrastructure.
    - title: Software Engineer Intern
      institution: Hevlett-Packard Enterprise
      logo: assets/img/hpe.png
      year: 2018 - 2019
      description:
        - Developed a proof of concept for Data Center Configuration Management, using OneCMDB to map relationships between network devices. Built modules for asset configuration tracking, network scanning, and automated remediation to address potential security threats, enhancing infrastructure visibility and compliance.
    - title: Machine Learning Intern
      institution: Defence Research and Development Organisation (DRDO)
      logo: assets/img/drdo.png
      year: 2018
      description:
        - Developed a real-time video surveillance system to detect and alert intrusions by unauthorized personnel within secured perimeters. Implemented custom intrusion rules and used YOLOv3 for real-time detection and classification of individuals as friend or foe. Built a MEAN stack dashboard to monitor and manage live alerts from the system.

